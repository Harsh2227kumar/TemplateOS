# Local development services (V1.6 Phase 2).
# Only Gotenberg (DOCX -> PDF) runs in Docker; the backend and frontend stay
# local dev servers. Start it with:
#   docker compose up -d gotenberg
#   python backend/scripts/verify_gotenberg.py --live
# Port 3000 busy? Change the left side of the port mapping and GOTENBERG_URL.
services:
  gotenberg:
    image: gotenberg/gotenberg:8
    container_name: templateos-gotenberg
    ports:
      - "3000:3000"
    command:
      - "gotenberg"
      - "--api-timeout=60s"
      - "--libreoffice-restart-after=50"
      - "--log-level=info"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Word file editor (V1.7 Phase 2.1): ONLYOFFICE Docs Community Edition
  # (free, AGPL v3, run unmodified; up to 20 simultaneous editors). Start it
  # yourself (large image, first start takes a few minutes):
  #   ONLYOFFICE_JWT_SECRET=<same value as in .env> docker compose up -d onlyoffice
  # Then set ONLYOFFICE_ENABLED=true, ONLYOFFICE_PUBLIC_URL=http://localhost:8082
  # and ONLYOFFICE_JWT_SECRET in .env. The container reaches the backend on the
  # host through host.docker.internal (BACKEND_URL_FOR_ONLYOFFICE), so run
  # uvicorn with --host 0.0.0.0 while editing.
  onlyoffice:
    image: onlyoffice/documentserver:8.3
    # Not part of a plain `docker compose up`; naming the service starts it.
    profiles: ["editor"]
    container_name: templateos-onlyoffice
    ports:
      - "8082:80"
    environment:
      JWT_ENABLED: "true"
      # Must equal the backend's ONLYOFFICE_JWT_SECRET. Not required here so
      # the other services start without it (unset = a random secret, and the
      # editor then reports a token error).
      JWT_SECRET: "${ONLYOFFICE_JWT_SECRET:-}"
      JWT_HEADER: "Authorization"
      # The backend is reached via host.docker.internal (a private address),
      # which the Document Server refuses to download from by default.
      ALLOW_PRIVATE_IP_ADDRESS: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 5
